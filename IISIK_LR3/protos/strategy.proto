syntax = "proto3";

package strategy;

service StrategyService {
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
  rpc AnalyzeStrategy(AnalyzeStrategyRequest) returns (Strategy);
}

message Strategy {
  string id = 1;
  string product_id = 2;
  string competitor_name = 3;
  string strategy_type = 4;
  string competitor_price = 5;
  optional string price_change_percent = 6;
  optional string estimated_probability = 7;
  string created_at = 8;
}

message ListStrategiesRequest {
  optional string product_id = 1;
}

message ListStrategiesResponse {
  repeated Strategy strategies = 1;
}

message CompetitorPricePoint {
  string competitor_name = 1;
  string price = 2;
  optional string observed_at = 3;
}

message AnalyzeStrategyRequest {
  string product_id = 1;
  string current_price = 2;
  repeated CompetitorPricePoint competitor_prices = 3;
}
